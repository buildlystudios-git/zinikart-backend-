name: Deploy to Amazon ECS (Production)

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_APP_REPOSITORY: zinikart-backend
  ECR_WS_REPOSITORY: zinikart-ws
  ECS_CLUSTER: zinikart-prod
  ECS_APP_SERVICE: zinikart-prod-app
  ECS_WS_SERVICE: zinikart-prod-ws

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::567519737321:role/GitHubActionsECSRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push App image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_APP_REPOSITORY:latest -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_APP_REPOSITORY:latest

      - name: Build, tag, and push WebSocket image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_WS_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_WS_REPOSITORY:latest -f Dockerfile.ws .
          docker push $ECR_REGISTRY/$ECR_WS_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_WS_REPOSITORY:latest

      - name: Deploy services to Amazon ECS
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_APP_SERVICE }} --force-new-deployment
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_WS_SERVICE }} --force-new-deployment
